<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#141312" />
    <script>
      // First visit to the homepage: start the opening photo right away, alongside the app's code, which would
      // otherwise only discover it once it has loaded. (Returning visitors have it cached; and only on a first
      // visit is it certain which photo opens the page — the CMS can change it.)
      (function () {
        try {
          var base = '%BASE_URL%';
          var path = location.pathname;
          if ((path === base || path + '/' === base) && !localStorage.getItem('tersun-db')) {
            var link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'image';
            // a phone held upright gets the upright crop (as the hero's <picture> does)
            var upright = window.matchMedia && window.matchMedia('(orientation: portrait)').matches;
            link.href = base + 'images/hero/bioclimatic' + (upright ? '-portrait' : '') + '.webp';
            link.setAttribute('fetchpriority', 'high');
            document.head.appendChild(link);
          }
        } catch (e) {}
      })();
    </script>
    <!-- seo:start — the build writes one file per public page with its own head here (src/seo/pages.ts) -->
    <title>TERSUN — Beyond Outdoor Living</title>
    <meta name="description" content="Pergola bioklimatike, mbulesa xhami, tenda mbi xham, xhama Guillotine e Slide dhe perde Zip. Projektoni tarracën tuaj në 3D — konsultë falas në vend." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TERSUN" />
    <meta property="og:url" content="%SITE_ORIGIN%%BASE_URL%" />
    <meta property="og:title" content="TERSUN — Beyond Outdoor Living" />
    <meta property="og:image" content="%SITE_ORIGIN%%BASE_URL%images/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- seo:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

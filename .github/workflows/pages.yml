# Builds the TERSUN site for https://ariongj.github.io/TERSUN/ and publishes it to the gh-pages branch.
name: Publish site

on:
  push:
    branches: [claude/tersun-company-setup-5a6sj8, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (base /TERSUN/)
        run: npm run build
        env:
          BASE_PATH: /TERSUN/
      # SPA fallback: GitHub Pages serves 404.html for deep links, so it must be the app shell.
      - name: SPA fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: Publish site
